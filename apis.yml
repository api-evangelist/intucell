name: Intucell
description: >-
  Intucell was an Israeli self-optimizing network (SON) software company headquartered in
  Ra'anana, Israel, whose platform let mobile carriers automatically plan, configure, manage,
  optimize and heal cellular radio access networks in real time as network demand changed.
  Backed by Bessemer Venture Partners on roughly $6M raised, Intucell was acquired by Cisco
  Systems for approximately $475M in a deal completed February 25, 2013, and its SON technology
  was folded into Cisco's mobility and service-provider portfolio (later divested to HCL).
  The company operates no standalone public developer program or API today; this profile is
  retained as an acquired-company / VC-portfolio record in the API Evangelist network.
